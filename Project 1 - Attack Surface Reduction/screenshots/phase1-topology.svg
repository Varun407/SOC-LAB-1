<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" />
    </filter>
    <!-- Markers for the lightweight interconnections -->
    <marker id="arrow-light-fwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-light-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">SOC Lab : Phase 1 Topology</text>
  <text x="450" y="65" text-anchor="middle" font-size="14" fill="#64748b">Flat internal network behind a single firewall</text>

  <rect x="20" y="90" width="860" height="510" rx="16" fill="#f6f5f4" stroke="#e7e5e4" stroke-width="2" />
  <text x="50" y="130" font-size="18" font-weight="600" fill="#292524">Windows host machine</text>
  <text x="50" y="152" font-size="14" fill="#57534e">VirtualBox hypervisor</text>

  <!-- Internet to pfSense (Standard link, no arrows) -->
  <path d="M 450 210 L 450 260" stroke="#9ca3af" stroke-width="2" />
  <text x="465" y="235" font-size="12" fill="#9ca3af">WAN (NAT)</text>

  <!-- Internet Node -->
  <rect x="370" y="160" width="160" height="50" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <text x="450" y="190" text-anchor="middle" font-size="15" font-weight="500" fill="#334155"> Internet</text>

  <!-- pfSense Node -->
  <rect x="325" y="260" width="250" height="60" rx="8" fill="#3b82f6" filter="url(#shadow)" />
  <text x="450" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">pfSense</text>
  <text x="450" y="305" text-anchor="middle" font-size="12" fill="#eff6ff">Firewall &amp; router · 192.168.10.1</text>

  <!-- Single LAN connection splitting into three (Standard links, no arrows) -->
  <path d="M 450 320 L 450 360" stroke="#9ca3af" stroke-width="2" />
  <path d="M 200 360 L 700 360" stroke="#9ca3af" stroke-width="2" />
  <path d="M 200 360 L 200 410" stroke="#9ca3af" stroke-width="2" />
  <path d="M 450 360 L 450 410" stroke="#9ca3af" stroke-width="2" />
  <path d="M 700 360 L 700 410" stroke="#9ca3af" stroke-width="2" />

  <text x="465" y="340" font-size="12" fill="#9ca3af">LAN · 192.168.10.0/24</text>

  <!-- Kali Node -->
  <rect x="90" y="410" width="220" height="65" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)" />
  <text x="200" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">Kali Linux</text>
  <text x="200" y="455" text-anchor="middle" font-size="12" fill="#991b1b">Attacker · 192.168.10.100</text>

  <!-- Windows Node -->
  <rect x="340" y="410" width="220" height="65" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)" />
  <text x="450" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">Windows 11</text>
  <text x="450" y="455" text-anchor="middle" font-size="12" fill="#92400e">Admin · 192.168.10.103</text>

  <!-- Ubuntu Node -->
  <rect x="590" y="410" width="220" height="65" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
  <text x="700" y="435" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">Ubuntu Server</text>
  <text x="700" y="455" text-anchor="middle" font-size="12" fill="#166534">Target · 192.168.10.102</text>

  <!-- Lightweight Interconnections (Peer-to-peer traffic) -->
  <path d="M 315 442.5 L 335 442.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-start="url(#arrow-light-rev)" marker-end="url(#arrow-light-fwd)" />
  <path d="M 565 442.5 L 585 442.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-start="url(#arrow-light-rev)" marker-end="url(#arrow-light-fwd)" />
  <path d="M 200 480 Q 450 530 700 480" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" fill="none" marker-start="url(#arrow-light-rev)" marker-end="url(#arrow-light-fwd)" />
  <text x="450" y="515" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Unrestricted peer-to-peer communication</text>

  <!-- Footer -->
  <text x="450" y="570" text-anchor="middle" font-size="12" fill="#78716c">All machines share the same broadcast domain: any host can reach any other host directly</text>
</svg>

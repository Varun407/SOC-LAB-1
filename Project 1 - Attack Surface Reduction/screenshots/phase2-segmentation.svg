<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05" />
    </filter>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a" />
    </marker>
  </defs>

  <!-- Titles -->
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">SOC Lab : Phase 2 Segmentation</text>
  <text x="550" y="70" text-anchor="middle" font-size="15" fill="#64748b">Three isolated zones; firewall policy controls what can reach the server</text>

  <!-- Windows Host Container (Expanded) -->
  <rect x="30" y="110" width="1040" height="710" rx="16" fill="#f6f5f4" stroke="#e7e5e4" stroke-width="2" />
  <text x="70" y="155" font-size="20" font-weight="600" fill="#292524">Windows host machine</text>
  <text x="70" y="180" font-size="15" fill="#57534e">VirtualBox hypervisor</text>

  <!-- WAN Connection (Standard link, no arrows) -->
  <path d="M 550 230 L 550 280" stroke="#9ca3af" stroke-width="2" />
  <text x="570" y="260" font-size="13" fill="#9ca3af">WAN</text>

  <!-- Internet Node -->
  <rect x="470" y="180" width="160" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
  <text x="550" y="214" text-anchor="middle" font-size="16" font-weight="500" fill="#334155"> Internet</text>

  <!-- pfSense Node -->
  <rect x="350" y="280" width="400" height="80" rx="8" fill="#3b82f6" filter="url(#shadow)" />
  <text x="550" y="312" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">pfSense</text>
  <text x="550" y="344" text-anchor="middle" font-size="13" fill="#eff6ff">em1 (LAN) · em2 (OPT1) · em3 (OPT2)</text>

  <!-- Three distinct interfaces originating from pfSense (Standard links, no arrows) -->
  <path d="M 400 360 L 400 420 L 220 420 L 220 480" fill="none" stroke="#9ca3af" stroke-width="2" />
  <path d="M 550 360 L 550 480" fill="none" stroke="#9ca3af" stroke-width="2" />
  <path d="M 700 360 L 700 420 L 880 420 L 880 480" fill="none" stroke="#9ca3af" stroke-width="2" />

  <text x="310" y="410" text-anchor="middle" font-size="13" fill="#9ca3af">LAN</text>
  <text x="575" y="430" font-size="13" fill="#9ca3af">OPT1</text>
  <text x="790" y="410" text-anchor="middle" font-size="13" fill="#9ca3af">OPT2</text>

  <!-- Zones (Expanded Width and Height for better padding) -->
  
  <!-- USER LAN -->
  <rect x="70" y="480" width="300" height="85" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)" />
  <text x="220" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#b91c1c">USER LAN</text>
  <text x="220" y="528" text-anchor="middle" font-size="12" fill="#991b1b">192.168.10.0/24</text>
  <rect x="90" y="542" width="260" height="28" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1" />
  <text x="220" y="561" text-anchor="middle" font-size="13" fill="#7f1d1d">Kali Linux · Attacker · 192.168.10.100</text>

  <!-- SERVER LAN -->
  <rect x="400" y="480" width="300" height="85" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)" />
  <text x="550" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">SERVER LAN</text>
  <text x="550" y="528" text-anchor="middle" font-size="12" fill="#166534">192.168.20.0/24</text>
  <rect x="420" y="542" width="260" height="28" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1" />
  <text x="550" y="561" text-anchor="middle" font-size="13" fill="#14532d">Ubuntu Server · Target · 192.168.20.102</text>

  <!-- ADMIN LAN -->
  <rect x="730" y="480" width="300" height="85" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#shadow)" />
  <text x="880" y="510" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">ADMIN LAN</text>
  <text x="880" y="528" text-anchor="middle" font-size="12" fill="#92400e">192.168.30.0/24</text>
  <rect x="750" y="542" width="260" height="28" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1" />
  <text x="880" y="561" text-anchor="middle" font-size="13" fill="#78350f">Windows 11 · Admin · 192.168.30.10</text>

  <!-- Logic Paths (Curved Lines for Policy, with relaxed arcs) -->
  
  <!-- Blocked SSH Path -->
  <path d="M 220 580 Q 365 670 510 585" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)" />
  <circle cx="365" cy="625" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.5" />
  <path d="M 358 618 L 372 632 M 372 618 L 358 632" stroke="#dc2626" stroke-width="2" />
  <text x="365" y="665" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">SSH BLOCKED</text>
  <text x="365" y="682" text-anchor="middle" font-size="12" fill="#78716c">USER → SERVER, TCP/22</text>

  <!-- Allowed SSH Path -->
  <path d="M 880 580 Q 735 670 590 585" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <circle cx="735" cy="625" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
  <path d="M 730 625 L 734 629 L 741 620" stroke="#16a34a" fill="none" stroke-width="2.5" />
  <text x="735" y="665" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">SSH ALLOWED</text>
  <text x="735" y="682" text-anchor="middle" font-size="12" fill="#78716c">ADMIN → SERVER, TCP/22</text>

  <!-- Footer -->
  <text x="550" y="755" text-anchor="middle" font-size="14" font-style="italic" fill="#57534e">A compromised USER-zone machine cannot reach the server directly. Traffic must pass through pfSense policy.</text>
  <text x="550" y="780" text-anchor="middle" font-size="13" fill="#78716c">ICMP and TCP are enforced independently: ping can fail while SSH still succeeds, and vice versa</text>
</svg>
